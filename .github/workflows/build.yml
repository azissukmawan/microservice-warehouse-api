name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/microservice-warehouse-api

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            context: ./user-service
          - service: product-service
            context: ./product-service
          - service: transaction-service
            context: ./transaction-service
          - service: warehouse-service
            context: ./warehouse-service
          - service: merchant-service
            context: ./merchant-service
          - service: notification-service
            context: ./notification-service
          - service: api-gateway
            context: ./api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.service }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          dockerfile: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:buildcache,mode=max

  notify-complete:
    name: Notify Build Complete
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| user-service | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| product-service | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| transaction-service | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| warehouse-service | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| merchant-service | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| notification-service | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| api-gateway | ${{ needs.build-and-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images pushed to: \`ghcr.io/${{ github.repository_owner }}/microservice-warehouse-api\`" >> $GITHUB_STEP_SUMMARY
